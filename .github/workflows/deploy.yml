# Builds the site and uploads it to Globehost over FTP on every push to main.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.simplynsorted.com
#   FTP_USERNAME  your cPanel/FTP username
#   FTP_PASSWORD  your FTP password
# Optional repository variable FTP_SERVER_DIR (default: ./ — the FTP account's home, which is the website root)

name: Build & deploy to Globehost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check FTP secrets are set
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP secrets not set yet — skipping upload. The build itself passed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Globehost via FTP
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # The Globehost FTP account already opens in the website root, so upload there.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Only uploads changed files after the first run.
